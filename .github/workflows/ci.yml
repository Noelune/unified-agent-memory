name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Core tests (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run core tests
        run: python -m unittest discover -s core/tests -v

  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license:
    name: License check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: LICENSE file present and MIT
        run: |
          test -f LICENSE || { echo "LICENSE missing"; exit 1; }
          grep -qi "MIT License" LICENSE || { echo "LICENSE is not MIT"; exit 1; }
