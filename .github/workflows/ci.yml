name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Core tests (unittest)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run core tests
        run: python -m unittest discover -s core/tests -v

  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history after force-push
        if: github.event_name == 'push' && github.event.forced == true
        shell: bash
        run: |
          version="8.24.3"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --redact --verbose --exit-code 2 \
            --report-format sarif --report-path results.sarif
      - uses: gitleaks/gitleaks-action@v2
        if: github.event_name != 'push' || github.event.forced != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license:
    name: License check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: LICENSE file present and MIT
        run: |
          test -f LICENSE || { echo "LICENSE missing"; exit 1; }
          grep -qi "MIT License" LICENSE || { echo "LICENSE is not MIT"; exit 1; }
