[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-agent-memory-core"
version = "0.1.0"
description = "Dependency-free core of unified-agent-memory: shared Obsidian-vault memory with search, promotion, conflict adjudication and forgetting — no agent runtime required."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Noelune" }]
keywords = ["memory", "obsidian", "agent", "dsh", "multi-agent", "knowledge-base"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
memory = "unified_memory.memory:main"
unified-memory-promoter = "unified_memory.promoter:main"
unified-memory-forgetter = "unified_memory.forgetter:main"

[tool.setuptools]
packages = ["unified_memory"]
